modules:
  jira:adminPage:
    - key: afterlife-admin
      resource: admin
      resolver:
        function: resolver
      title: InfoPath Afterlife
      icon: resource:admin;icon.svg

  rovo:agent:
    - key: afterlife-agent
      name: InfoPath Afterlife
      description: Knows every InfoPath form this site still has to move to Jira Service Management, what stops each one from working, and can create its replacement on a new request type.
      icon: resource:admin;icon.svg
      prompt: resource:prompts;agent.md
      conversationStarters:
        - Which InfoPath forms should we migrate first?
        - What stops the Expense Report form from working?
        - Create the JSM form for Leave Request
      actions:
        - list-legacy-forms
        - get-legacy-form
        - list-service-projects
        - create-jsm-form
      skills:
        - infopath-migration-plan

  rovo:skill:
    - key: infopath-migration-plan
      source:
        dir: skills/infopath-migration-plan
      dependencies:
        tools:
          - list-legacy-forms
          - get-legacy-form
          - list-service-projects
          - create-jsm-form

  rovo:mcp:
    - key: afterlife-mcp
      name: InfoPath Afterlife
      tools:
        - list-legacy-forms
        - get-legacy-form
        - list-service-projects
        - create-jsm-form

  action:
    - key: list-legacy-forms
      name: list-legacy-forms
      function: list-legacy-forms-fn
      actionVerb: GET
      description: Lists every analysed InfoPath form with its migration wave, size, causes of death, and whether its JSM form is created, live in the portal or waiting for a portal group. Use it for questions about the migration plan or the order of work.
    - key: get-legacy-form
      name: get-legacy-form
      function: get-legacy-form-fn
      actionVerb: GET
      description: Returns one InfoPath form's death certificate, its field-by-field conversion map and, for each JSM form made from it, the portal link and whether it is live. Use it for questions about one form, what needs manual work, or where people fill it in now.
      inputs:
        form:
          title: Form
          type: string
          required: true
          description: The name of the InfoPath form, or part of it, for example "Expense
            Report".
    - key: list-service-projects
      name: list-service-projects
      function: service-projects-fn
      actionVerb: GET
      description: Lists the service projects the person asking administers, which are
        the only ones they can add a form to. Use it before creating a form
        when the user has not named the project.
    - key: create-jsm-form
      name: create-jsm-form
      function: create-jsm-form-fn
      actionVerb: CREATE
      description: Replaces one analysed InfoPath form. Makes a request type named after it in a service project, puts the JSM form on it, returns the portal link and the step left before it is live. Only when the user asks to create or replace a form and names a project.
      inputs:
        form:
          title: Form
          type: string
          required: true
          description: The name of the InfoPath form to convert.
        projectKey:
          title: Project key
          type: string
          required: true
          description: The key of the service project that receives the form, as returned
            by list-service-projects, for example "HR".

  function:
    - key: resolver
      handler: index.handler
    - key: list-legacy-forms-fn
      handler: index.listLegacyForms
    - key: get-legacy-form-fn
      handler: index.getLegacyForm
    - key: create-jsm-form-fn
      handler: index.createJsmFormAction
    - key: service-projects-fn
      handler: index.listServiceProjects

resources:
  - key: admin
    path: static/admin
  - key: prompts
    path: prompts

permissions:
  scopes:
    - storage:app
    - read:jira-work
    - read:jira-user
    - read:servicedesk-request
    - manage:jira-project
    - read:requesttype:jira-service-management
    - write:requesttype:jira-service-management
  content:
    styles:
      - unsafe-inline

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/75ddeb29-1546-423b-a084-86dca835517f
